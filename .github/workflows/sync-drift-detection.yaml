name: Drift Detection

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect drift but don't create PRs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # Job 1: Collect all downstream repos from config
  # ────────────────────────────────────────────
  collect:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: List all downstream repos
        id: list
        run: |
          python3 << 'SCRIPT'
          import json
          import os
          import yaml

          with open("sync-config/sync-config.yaml") as f:
              config = yaml.safe_load(f)

          all_repos: list[dict[str, str]] = []
          seen: set[str] = set()

          def add_repo(repo: str, host: str) -> None:
              if repo not in seen:
                  seen.add(repo)
                  all_repos.append({"repo": repo, "host": host})

          for profile in config.get("profiles", {}).values():
              if not profile:
                  continue
              host = profile.get("host", "github.com")
              for repo in profile.get("repos", []):
                  add_repo(repo, host)

          for repo, standalone_config in config.get("standalone", {}).items():
              if not standalone_config:
                  continue
              host = standalone_config.get("host", "github.com")
              add_repo(repo, host)

          all_repos.sort(key=lambda r: r["repo"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"repos={json.dumps(all_repos)}\n")

          print(f"All downstream repos ({len(all_repos)}): {all_repos}")
          SCRIPT

      - name: Summary
        run: |
          REPOS='${{ steps.list.outputs.repos }}'
          REPO_COUNT=$(echo "$REPOS" | python3 -c "import sys,json; print(len(json.loads(sys.stdin.read())))" 2>/dev/null || echo "0")

          echo "## :satellite: Drift Detection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry run** | \`${{ inputs.dry_run || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Repos to check** | ${REPO_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Downstream repos" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REPO_COUNT" == "0" ]]; then
            echo "> No repos configured in sync-config.yaml." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$REPOS" | python3 -c "
          import sys, json
          repos = json.loads(sys.stdin.read())
          for r in repos:
              name = r['repo'] if isinstance(r, dict) else r
              host = r.get('host', 'github.com') if isinstance(r, dict) else 'github.com'
              print(f'- [\`{name}\`](https://{host}/{name})')
          " >> "$GITHUB_STEP_SUMMARY"
          fi

  # ────────────────────────────────────────────
  # Job 2: Check each repo for drift and sync if needed
  # ────────────────────────────────────────────
  check-drift:
    needs: collect
    if: ${{ needs.collect.outputs.repos != '[]' && needs.collect.outputs.repos != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.collect.outputs.repos) }}
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Detect drift and sync ${{ matrix.repo }}
        id: drift
        uses: ./.github/actions/sync-files
        with:
          downstream_repo: ${{ matrix.repo }}
          token: ${{ secrets.SYNC_PAT }}
          tokens: '{"github.com":"${{ secrets.SYNC_PAT }}","github.ibm.com":"${{ secrets.SYNC_PAT_GHE_IBM }}"}'
          hub_sha: ${{ github.sha }}
          changed_files: "[]"
          sync_mode: full
          dry_run: ${{ inputs.dry_run || 'false' }}

      - name: Summary
        if: always()
        run: |
          REPO="${{ matrix.repo }}"
          CHANGES="${{ steps.drift.outputs.changes_detected }}"
          FILES="${{ steps.drift.outputs.files_synced }}"
          PR="${{ steps.drift.outputs.pr_url }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          STATUS="${{ job.status }}"

          echo "## :mag: Drift Check: \`${REPO}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$STATUS" != "success" && "$CHANGES" != "true" && "$CHANGES" != "false" ]]; then
            echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Repo** | \`${REPO}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Status** | :warning: Failed to check — repo may not exist or token lacks access |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CHANGES" == "true" ]]; then
            echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Repo** | \`${REPO}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Drift detected** | :warning: Yes |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Files checked** | \`${FILES}\` |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "| **Mode** | Dry run (no PR created) |" >> "$GITHUB_STEP_SUMMARY"
            elif [[ -n "$PR" ]]; then
              echo "| **PR** | [${PR}](${PR}) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> :arrow_right: Downstream repo has drifted from the hub. Review the PR to re-align." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Repo** | \`${REPO}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Drift detected** | :white_check_mark: No |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Files checked** | \`${FILES}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> :white_check_mark: \`${REPO}\` is in sync with the hub." >> "$GITHUB_STEP_SUMMARY"
          fi
