name: Sync on Push

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "skills/**"
      - "scripts/**"
      - "templates/**"
      - "sync-config/**"

  workflow_dispatch:
    inputs:
      force_full_sync:
        description: "Force full sync to all downstream repos (ignores changed-file filtering)"
        type: boolean
        default: false
      dry_run:
        description: "Detect changes but don't create PRs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # Job 1: Lint — must pass before sync proceeds
  # ────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit
        id: pre_commit
        run: |
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee /tmp/pre-commit-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            if [[ "${{ steps.pre_commit.outcome }}" == "success" ]]; then
              echo "## :white_check_mark: Lint Passed"
            else
              echo "## :x: Lint Failed — Sync Blocked"
            fi
            echo ""

            # Parse hook results from pre-commit output
            if [[ -f /tmp/pre-commit-output.txt ]]; then
              echo "| Hook | Status |"
              echo "|------|--------|"
              while IFS= read -r line; do
                if echo "$line" | grep -qE '\.\.\.\.\.*Passed$'; then
                  HOOK_NAME=$(echo "$line" | sed 's/\.\.\.\.*Passed$//' | xargs)
                  echo "| ${HOOK_NAME} | :white_check_mark: Passed |"
                elif echo "$line" | grep -qE '\.\.\.\.*Failed$'; then
                  HOOK_NAME=$(echo "$line" | sed 's/\.\.\.\.*Failed$//' | xargs)
                  echo "| ${HOOK_NAME} | :x: Failed |"
                elif echo "$line" | grep -qE '\.\.\.\.*Skipped$'; then
                  HOOK_NAME=$(echo "$line" | sed 's/\.\.\.\.*Skipped$//' | xargs)
                  echo "| ${HOOK_NAME} | :next_track_button: Skipped |"
                fi
              done < /tmp/pre-commit-output.txt
              echo ""
            fi

            if [[ "${{ steps.pre_commit.outcome }}" != "success" ]]; then
              echo "Sync **will not run** until these are fixed."
              echo ""
              echo "Run locally to reproduce:"
              echo '```bash'
              echo "pre-commit run --all-files"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────
  # Job 2: Detect changed files and resolve affected repos
  # ────────────────────────────────────────────
  detect:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.resolve.outputs.repos }}
      changed_files: ${{ steps.changes.outputs.files }}
      sync_mode: ${{ steps.mode.outputs.sync_mode }}
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine sync mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_full_sync }}" == "true" ]]; then
            echo "sync_mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "sync_mode=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed files
        id: changes
        run: |
          if [[ "${{ steps.mode.outputs.sync_mode }}" == "full" ]]; then
            echo 'files=[]' >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- agents/ skills/ scripts/ templates/ sync-config/ 2>/dev/null || echo "")
            if [[ -z "$FILES" ]]; then
              echo 'files=[]' >> "$GITHUB_OUTPUT"
            else
              JSON=$(echo "$FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
              echo "files=${JSON}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve affected downstream repos
        id: resolve
        run: |
          python3 << 'SCRIPT'
          import json
          import os
          import yaml

          config_path = "sync-config/sync-config.yaml"
          with open(config_path) as f:
              config = yaml.safe_load(f)

          changed_files_json = os.environ.get("CHANGED_FILES", "[]")
          sync_mode = os.environ.get("SYNC_MODE", "incremental")
          changed_files = json.loads(changed_files_json)

          all_repos = []

          # Collect repos from profiles
          for profile_name, profile in config.get("profiles", {}).items():
              for repo in profile.get("repos", []):
                  if sync_mode == "full":
                      all_repos.append(repo)
                      continue
                  # Check if any changed file matches this profile's source mappings
                  for mapping in profile.get("mappings", []):
                      source = mapping["source"]
                      if any(f.startswith(source) for f in changed_files):
                          all_repos.append(repo)
                          break

          # Collect repos from standalone
          for repo, standalone_config in config.get("standalone", {}).items():
              if sync_mode == "full":
                  all_repos.append(repo)
                  continue
              for mapping in standalone_config.get("mappings", []):
                  source = mapping["source"]
                  if any(f.startswith(source) for f in changed_files):
                      all_repos.append(repo)
                      break

          # Deduplicate
          unique_repos = sorted(set(all_repos))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"repos={json.dumps(unique_repos)}\n")

          print(f"Affected repos ({len(unique_repos)}): {unique_repos}")
          SCRIPT
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
          SYNC_MODE: ${{ steps.mode.outputs.sync_mode }}

      - name: Summary
        env:
          REPOS: ${{ steps.resolve.outputs.repos }}
          MODE: ${{ steps.mode.outputs.sync_mode }}
          FILES: ${{ steps.changes.outputs.files }}
          EVENT: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.force_full_sync || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          HUB_SHA: ${{ github.sha }}
          HUB_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 << 'SUMMARY'
          import json, os

          repos = json.loads(os.environ.get("REPOS", "[]"))
          mode = os.environ["MODE"]
          files = json.loads(os.environ.get("FILES", "[]"))
          event = os.environ["EVENT"]
          force_full = os.environ["FORCE_FULL"]
          dry_run = os.environ["DRY_RUN"]
          hub_sha = os.environ["HUB_SHA"]
          hub_url = os.environ["HUB_URL"]
          short_sha = hub_sha[:7]
          summary = os.environ["GITHUB_STEP_SUMMARY"]

          lines = []
          lines.append("## :mag: Detection Results")
          lines.append("")

          # Run info table
          lines.append("| Setting | Value |")
          lines.append("|---------|-------|")
          lines.append(f"| **Trigger** | `{event}` |")
          lines.append(f"| **Sync mode** | `{mode}` |")
          lines.append(f"| **Hub commit** | [`{short_sha}`]({hub_url}/commit/{hub_sha}) |")

          if event == "workflow_dispatch":
              lines.append(f"| **Force full sync** | `{force_full}` |")
              lines.append(f"| **Dry run** | `{dry_run}` |")
          lines.append("")

          # Changed files (incremental only)
          if mode != "full" and files:
              lines.append(f"### Changed files ({len(files)})")
              lines.append("```")
              for f in files:
                  lines.append(f)
              lines.append("```")
              lines.append("")
          elif mode == "full":
              lines.append("> :arrows_counterclockwise: **Full sync** — all mapped files will be compared against downstream repos.")
              lines.append("")

          # Downstream repos
          repo_count = len(repos)
          lines.append(f"### Downstream repos ({repo_count})")
          lines.append("")
          if repo_count == 0:
              lines.append("> :pause_button: No downstream repos matched. Sync will be **skipped**.")
              if mode != "full" and files:
                  lines.append(">")
                  lines.append("> Changed files did not match any profile mapping sources.")
                  lines.append("> If you expected a sync, use **workflow_dispatch** with **Force full sync**.")
          else:
              for r in repos:
                  lines.append(f"- [`{r}`](https://github.com/{r})")
          lines.append("")

          with open(summary, "a") as f:
              f.write("\n".join(lines) + "\n")
          SUMMARY

  # ────────────────────────────────────────────
  # Job 3: Sync each affected repo in parallel
  # ────────────────────────────────────────────
  sync:
    needs: detect
    if: ${{ needs.detect.outputs.repos != '[]' && needs.detect.outputs.repos != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJson(needs.detect.outputs.repos) }}
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Sync files to ${{ matrix.repo }}
        id: sync
        uses: ./.github/actions/sync-files
        with:
          downstream_repo: ${{ matrix.repo }}
          token: ${{ secrets.SYNC_PAT }}
          hub_sha: ${{ github.sha }}
          changed_files: ${{ needs.detect.outputs.changed_files }}
          sync_mode: ${{ needs.detect.outputs.sync_mode }}
          dry_run: ${{ inputs.dry_run || 'false' }}

      - name: Summary
        if: always()
        env:
          REPO: ${{ matrix.repo }}
          CHANGES: ${{ steps.sync.outputs.changes_detected }}
          FILES_SYNCED: ${{ steps.sync.outputs.files_synced }}
          PR: ${{ steps.sync.outputs.pr_url }}
          CHANGED_LIST: ${{ steps.sync.outputs.changed_list }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SYNC_MODE: ${{ needs.detect.outputs.sync_mode }}
        run: |
          {
            echo "## :package: Sync: \`${REPO}\`"
            echo ""

            # Status banner
            if [[ "$CHANGES" == "true" && "$DRY_RUN" == "true" ]]; then
              echo "> :eyes: **Dry run** — changes detected but no PR was created."
            elif [[ "$CHANGES" == "true" && -n "$PR" ]]; then
              echo "> :arrow_right: **PR created** — review and merge to apply changes."
            elif [[ "$CHANGES" == "false" ]]; then
              echo "> :white_check_mark: **Already in sync** — no changes needed."
            else
              echo "> :warning: Changes detected but no PR was created."
            fi
            echo ""

            # Details table
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| **Downstream repo** | [\`${REPO}\`](https://github.com/${REPO}) |"
            echo "| **Sync mode** | \`${SYNC_MODE}\` |"
            echo "| **Changes detected** | \`${CHANGES}\` |"
            echo "| **Files in scope** | \`${FILES_SYNCED}\` |"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "| **Dry run** | \`true\` |"
            fi

            if [[ -n "$PR" ]]; then
              echo "| **Pull request** | [Open PR](${PR}) |"
            fi
            echo ""

            # Changed file list
            if [[ "$CHANGES" == "true" && -n "$CHANGED_LIST" ]]; then
              CHANGED_COUNT=$(echo "$CHANGED_LIST" | wc -l | tr -d ' ')
              echo "### Changed files (${CHANGED_COUNT})"
              echo ""
              echo '```'
              echo "$CHANGED_LIST"
              echo '```'
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
