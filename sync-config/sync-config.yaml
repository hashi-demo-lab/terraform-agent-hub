# terraform-agent-hub sync configuration
# Controls how files are synced from this hub to downstream repos.
# See sync-config/README.md for full schema documentation.

version: "1"

# ──────────────────────────────────────────────
# Defaults applied to all syncs unless overridden
# ──────────────────────────────────────────────
defaults:
  target_branch: main
  pr_labels:
    - hub-sync
  branch_prefix: "hub-sync/"
  commit_prefix: "chore(sync):"
  sync_deletions: true
  update_existing_pr: true

# ──────────────────────────────────────────────
# Patterns excluded from ALL syncs globally
# ──────────────────────────────────────────────
global_excludes:
  - ".DS_Store"
  - ".gitkeep"
  - "**/README.md"
  - "**/.terraform*"
  - "**/*.tfstate*"

# ──────────────────────────────────────────────
# Profiles — groups of repos sharing sync mappings
# ──────────────────────────────────────────────
profiles:
  # Templates-only profile: testing sync with templates first
  templates-only:
    repos:
      - hashi-demo-lab/ai-iac-module-template
    mappings:
      - source: templates/
        dest: .foundations/templates/

  # Standard profile: full sync of all content directories
  # Uncomment and add repos when ready to sync agents, skills, scripts, and templates
  # standard:
  #   repos:
  #     - hashi-demo-lab/ai-iac-module-template
  #   mappings:
  #     - source: agents/
  #       dest: .claude/agents/
  #     - source: skills/
  #       dest: .claude/skills/
  #     - source: scripts/
  #       dest: scripts/
  #     - source: templates/
  #       dest: .claude/templates/

# ──────────────────────────────────────────────
# Standalone repos — custom one-off mappings
# ──────────────────────────────────────────────
# standalone:
