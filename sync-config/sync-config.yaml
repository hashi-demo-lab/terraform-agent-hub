# terraform-agent-hub sync configuration
# Controls how files are synced from this hub to downstream repos.
# See sync-config/README.md for full schema documentation.

version: "1"

# ──────────────────────────────────────────────
# Defaults applied to all syncs unless overridden
# ──────────────────────────────────────────────
defaults:
  target_branch: main
  pr_labels:
    - hub-sync
  branch_prefix: "hub-sync/"
  commit_prefix: "chore(sync):"
  sync_deletions: true
  update_existing_pr: true

# ──────────────────────────────────────────────
# Patterns excluded from ALL syncs globally
# ──────────────────────────────────────────────
global_excludes:
  - ".DS_Store"
  - ".gitkeep"
  - "**/README.md"
  - "**/.terraform*"
  - "**/*.tfstate*"

# ──────────────────────────────────────────────
# Profiles — groups of repos sharing sync mappings
# ──────────────────────────────────────────────
profiles:
  # Module development profile: full sync of all content directories
  module-development:
    repos:
      - hashi-demo-lab/ai-iac-module-template
    mappings:
      - source: agents/
        dest: .claude/agents/
      - source: skills/
        dest: .claude/skills/
        excludes:
          - "skills/tf-consumer-plan/**"
      - source: scripts/
        dest: .foundations/scripts/bash
      - source: templates/
        dest: .foundations/templates/

  # Consumer development profile: excludes module-only skills
  consumer-development:
    repos:
      - hashi-demo-lab/ai-iac-consumer-template
    mappings:
      - source: agents/
        dest: .claude/agents/
      - source: skills/
        dest: .claude/skills/
        excludes:
          - "skills/tf-module-plan/**"
          - "skills/terraform-test/**"
      - source: scripts/
        dest: .foundations/scripts/bash
      - source: templates/
        dest: .foundations/templates/

  # GitHub Enterprise profile: same mappings, different host
  module-development-ghe:
    host: "github.ibm.com"
    repos:
      - AdvArch/ai-iac-module-template
    mappings:
      - source: agents/
        dest: .claude/agents/
      - source: skills/
        dest: .claude/skills/
        excludes:
          - "skills/tf-consumer-plan/**"
      - source: scripts/
        dest: .foundations/scripts/bash
      - source: templates/
        dest: .foundations/templates/

